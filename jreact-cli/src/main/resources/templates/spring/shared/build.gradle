// Types and @ServerApi interfaces used by both sides. Compiled for the JVM (server) and for the browser (TeaVM).
plugins {
    id 'java-library'
}

dependencies {
    api "dev.jreact:jreact-api:${jreactVersion}"
    api 'jakarta.validation:jakarta.validation-api:3.0.2'     // @NotBlank, @Size... on the API: the server checks them
    // generates TodoApiClient (browser), TodoApiDispatcher (server) and the JSON conversion from every @ServerApi interface
    annotationProcessor "dev.jreact:jreact-processor:${jreactVersion}"
}
