spring.application.name={{name}}
server.port=8080
# unknown URLs under these answer 404; everything else that is a page goes to the client router (see jreact-spring-boot-starter)
jreact.reserved-prefixes=/api,/_rpc,/actuator,/error,/__jreact
# pretty JSON errors from ResponseStatusException
server.error.include-message=always
# render the first page on the server (from the @Page classes in client/), the browser hydrates it. Off in `jreact dev`. Remove the line for a pure client rendered app
jreact.ssr.app=dev.jreact.generated.PagesApp
