spring.application.name=library
server.port=8080
# unknown URLs under these answer 404; everything else that is a page goes to the client router (see jreact-spring-boot-starter)
jreact.reserved-prefixes=/api,/_rpc,/actuator,/error,/__jreact
# pretty JSON errors from ResponseStatusException
server.error.include-message=always
# render the first page on the server (from the routes in client/.../App), the browser hydrates it. Off in `jreact dev`. Remove the line for a pure client rendered app
jreact.ssr.app=dev.jreact.examples.library.client.App

# in-memory H2: the data lives as long as the server runs. Hibernate creates the table from BookEntity
spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
