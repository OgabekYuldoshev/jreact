name: Release

# Push a tag like v0.1.0: tests, then signed jars to Maven Central (Central Portal) and a GitHub release with the CLI.
# Secrets: CENTRAL_USERNAME, CENTRAL_TOKEN (Central Portal user token), GPG_PRIVATE_KEY (armored), GPG_PASSPHRASE.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version from the tag
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Tests
        run: ./build.sh test
      - name: Deploy to Maven Central
        run: mvn -B -Prelease -DskipTests deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes jreact-cli/target/jreact-cli.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
